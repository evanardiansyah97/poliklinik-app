<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        crossorigin="anonymous" />

    <link rel="preload" as="style" href="http://127.0.0.1:8000/build/assets/app-CcwFYkN6.css" /><link rel="modulepreload" as="script" href="http://127.0.0.1:8000/build/assets/app-DMsN-rLE.js" /><link rel="stylesheet" href="http://127.0.0.1:8000/build/assets/app-CcwFYkN6.css" /><script type="module" src="http://127.0.0.1:8000/build/assets/app-DMsN-rLE.js"></script>
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .brand-serif {
            font-family: 'Instrument Serif', serif;
        }
    </style>
</head>

<body
    style="min-height:100vh;background:linear-gradient(135deg,#1e2d6b 0%,#2d4499 60%,#1a2d7a 100%);display:flex;align-items:center;justify-content:center;padding:24px;">

    <div class="card bg-base-100 shadow-2xl rounded-2xl w-full max-w-[420px]">
        <div class="card-body my-2 p-[40px]">

            
            <div class="text-center mb-8">
                <img src="http://127.0.0.1:8000/images/logo-bengkot.png"
                    class="w-[60px] h-[60px] rounded-[16px] object-cover mx-auto mb-[14px] block">

                <h1 class="text-[1.5rem] font-extrabold text-[#1e2d6b] m-0 mb-[6px]">
                    Poliklinik
                </h1>

                <p class="text-[0.83rem] text-slate-400 m-0">
                    Masuk ke akun Anda
                </p>
            </div>


            
            

            <form action="http://127.0.0.1:8000/login" method="POST">
                <input type="hidden" name="_token" value="ZtZLGBeQ1ZsspXPpgGW7vS2wWteoY4SmffYYHXPQ" autocomplete="off">

                
                <div class="form-control mb-4">

                    <label class="label pb-1">
                        <span class="text-[0.82rem] font-semibold text-gray-700">
                            Email
                        </span>
                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-[10px] border-slate-200 bg-slate-50">
                        <i class="fas fa-envelope text-slate-400 text-[0.82rem]"></i>

                        <input type="email" name="email" value="" placeholder="Masukkan email..."
                            class="grow bg-transparent text-slate-800 text-[0.88rem]" required>
                    </label>

                </div>


                
                <div class="form-control mb-6">

                    <label class="label pb-1">
                        <span class="text-[0.82rem] font-semibold text-gray-700">
                            Password
                        </span>
                    </label>

                    <label class="input input-bordered flex items-center gap-3 rounded-[10px] border-slate-200 bg-slate-50">
                        <i class="fas fa-lock text-slate-400 text-[0.82rem]"></i>

                        <input type="password" name="password" id="password_login" placeholder="Masukkan password..."
                            class="grow bg-transparent text-slate-800 text-[0.88rem]" required>

                        <i class="fas fa-eye text-slate-400 text-[0.82rem] cursor-pointer" id="toggle_login"
                            onclick="togglePassword('password_login', 'toggle_login')"></i>

                    </label>

                </div>


                
                <button type="submit" class="btn-primary-gradient mt-6">
                    <i class="fas fa-right-to-bracket"></i>
                    Login
                </button>

            </form>


            
            <p class="text-center mt-5 text-[0.83rem] text-slate-400">
                Belum punya akun?
                <a href="http://127.0.0.1:8000/register" class="text-[#2d4499] font-bold no-underline">
                    Register
                </a>
            </p>

        </div>
    </div>
        <script>
        function togglePassword(inputId, iconId) {

            const input = document.getElementById(inputId);
            const icon  = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } 
            else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }

        }

    </script>
    </body>

</html>
